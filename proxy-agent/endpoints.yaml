# Maps logical operations to actual REST paths / CLI show-commands.
#
# AOS8 uses a Mobility Master (MM) / Mobility Controller (MD) architecture: the MM is the
# single point of configuration and monitoring, but it never terminates APs itself -- every
# AP is homed on a specific MD ("anchor controller"), and AP-local actions like `ap convert`
# have to land on that AP's actual anchor MD, not the MM. AOS8's REST API handles this via
# the `config_path` query parameter, which addresses a node in the MM's configuration
# hierarchy (e.g. "/mm" for master-wide scope, or a device node's own path such as
# "/md/Boston/MD1" for a specific MD) -- the same login session works for both, you just
# change config_path per call. See README.md "Mobility Master / Mobility Controller
# hierarchy" for how this app discovers and uses that mapping.
#
# Entries marked VERIFIED are confirmed against Aruba's own developer-hub docs/examples.
# Entries marked UNVERIFIED are the best-known-correct guesses based on the *documented
# CLI verb set* (ap convert add/pre-validate/active/cancel) but the REST object/action
# names themselves haven't been confirmed against a live controller -- use
# GET /api/aos8/discover to check/correct them.

aos8:
  login: "/v1/api/login"                                       # VERIFIED
  logout: "/v1/api/logout"                                     # VERIFIED
  write_memory: "/v1/configuration/object/write_memory"        # VERIFIED
  showcommand: "/v1/configuration/showcommand"                 # VERIFIED (generic "show ..." passthrough)

  # Show-command strings run through `showcommand`, at MM ("/mm") scope so they return
  # network-wide results across every managed MD. VERIFIED against Aruba's dev-hub examples.
  show_switches_command: "show switches"
  show_ap_database_command: "show ap database long"
  ap_convert_status_command: "show ap convert-status"

  # Best-effort local-flash storage listing, for the firmware pre-flight check.
  # UNVERIFIED exact command name -- AOS8 doesn't document a single canonical one, so
  # this tries each in order and uses whichever one succeeds first ("show storage" is
  # the common ArubaOS convention; "show image version" is the CLI command that lists
  # boot-partition firmware images, which is closer to what this check actually wants
  # to confirm; "show flash" is a plausible fallback). Add another candidate here if
  # none of these work against your firmware -- app.py tries them in list order.
  show_storage_commands:
    - "show storage"
    - "show image version"
    - "show flash"

  # Best-effort lookup of the controller's configured regulatory domain / country
  # code -- `ap convert` permanently writes this onto every AP it converts (it cannot
  # be changed afterward short of a factory reset), so the GUI surfaces it as a
  # pre-flight warning (see README "Country code is permanent"). UNVERIFIED exact
  # command/profile name -- AOS8 configures this per `ap regulatory-domain-profile`,
  # commonly named "default" unless customized; adjust the profile name if your
  # controller uses a different one. The GUI degrades gracefully to a static warning
  # (no detected code) if this call fails.
  show_regulatory_domain_command: "show ap regulatory-domain-profile default"

  # Best-effort per-AP effective-config dump, for the pre-conversion snapshot (see
  # app.py aos8_snapshot_config()). UNVERIFIED -- tries each in order and uses
  # whichever the controller accepts. "{ap_name}" is substituted with the AP's own
  # name (from show ap database). Not parsed into specific fields (VLAN/AP1X/proxy/
  # PPPoE/mesh) since the response shape isn't confirmed -- stored raw for manual
  # reference instead.
  show_ap_config_commands:
    - "show ap config effective ap-name {ap_name}"
    - "show running-config ap-name {ap_name}"
    - "show ap details ap-name {ap_name}"

  # AP conversion family. REST object *names* are still UNVERIFIED (confirm via
  # /api/aos8/discover) but the CLI verbs and their exact argument shapes are now
  # confirmed against HPE's own docs (Migrating controller managed APs to AOS 10):
  #
  #   ap convert add {ap-group <name> | ap-name <name>}
  #   ap convert pre-validate {all-aps | specific-aps}
  #   ap convert active {all-aps | specific-aps} server {ftp|tftp|http|https|scp} ... <image[;image2][.tar]>
  #   ap convert active {all-aps | specific-aps} local-flash <image[;image2][.tar]>
  #   ap convert cancel
  #   ap convert delete {ap-group <name> | ap-name <name>}
  #   ap convert clear-all
  #
  # Must be POSTed with config_path set to the AP's *anchor MD's* hierarchy node (the
  # "Location" field from `show switches`), not "/mm" -- these are live, device-local
  # actions, unlike the network-wide show-commands above.
  ap_convert_add: "/v1/configuration/object/ap_convert_add"
  ap_convert_prevalidate: "/v1/configuration/object/ap_convert_prevalidate"
  ap_convert_active: "/v1/configuration/object/ap_convert_active"
  ap_convert_cancel: "/v1/configuration/object/ap_convert_cancel"
  ap_convert_delete: "/v1/configuration/object/ap_convert_delete"
  ap_convert_clear_all: "/v1/configuration/object/ap_convert_clear_all"

  # Candidate paths the discovery helper probes to find the controller's own live API
  # index/spec -- confirmed by Aruba's docs to exist at "/api" after authenticating.
  discovery_candidates:
    - "/api"
    - "/v1/api-docs"
    - "/v3/api-docs"

central:
  # VERIFIED against Aruba's own aruba/central-automation-studio tool source
  # (UI/assets/js/site-mgmt.js, UI/assets/js/migration.js).
  sites_associate: "/central/v2/sites/associate"    # assign a device to a site (per-device call)
  sites: "/central/v2/sites"
  devices: "/device_inventory/v1/devices"
  group_move: "/configuration/v1/devices/move"      # moves devices between GROUPS, not sites -- unused in Phase 1

  # Rollback (convert-aos-ap cap) is issued by the proxy agent over direct SSH to the AP
  # (see ssh_client.py) rather than through Central -- Central's Remote Console has no
  # documented single-command REST/WebSocket API, only an interactive UI terminal.
